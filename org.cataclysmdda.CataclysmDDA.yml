id: org.cataclysmdda.CataclysmDDA
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: cataclysm-tiles
finish-args:
  - --socket=pulseaudio
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri

modules:
  - name: SDL3
    config-opts:
      - -DSDL_TEST_LIBRARY=OFF
      - -DSDL_TESTS=OFF
      - -DSDL_EXAMPLES=OFF
      - -DSDL_DEPS_SHARED=OFF
    cleanup:
      - /include
      - /lib/cmake
      - /lib/pkgconfig
    buildsystem: cmake-ninja
    builddir: true
    sources:
      - type: archive
        url: https://github.com/libsdl-org/SDL/archive/refs/tags/release-3.4.10.tar.gz
        sha256: 0dc11d980ba17250200718fa4e28011da293f27ed92f92203afffe396811f307

  - name: SDL_mixer
    config-opts:
      - -DSDLMIXER_TESTS=OFF
      - -DSDLMIXER_EXAMPLES=OFF
      - -DSDLMIXER_DEPS_SHARED=OFF
    cleanup:
      - /include
      - /lib/cmake
      - /lib/pkgconfig
    buildsystem: cmake-ninja
    builddir: true
    sources:
      - type: archive
        url: https://github.com/libsdl-org/SDL_mixer/archive/refs/tags/release-3.2.4.tar.gz
        sha256: f2ea848ccdf2f394cd4973ee0f6c482e04511044695cccfd46bab6dcd7f780aa

  - name: cataclysm-tiles
    buildsystem: simple
    build-options:
      cxxflags: -Wno-error=template-body
      prepend-pkg-config-path: /app/lib64/pkgconfig
      prepend-ld-library-path: /app/lib64
      env:
        MAKE_ARGS: PREFIX=/app LANGUAGES=all USE_XDG_DIR=1 TILES=1 SOUND=1 RELEASE=1 RUNTESTS=0 ASTYLE=0 LINTJSON=0
    build-commands:
      - |
        if [ "$FLATPAK_ARCH" = "aarch64" ]; then
          sed -i 's# CFLAGS += -mcx16##g; s# CXXFLAGS += -mcx16##g' Makefile
        fi
      - make -j $FLATPAK_BUILDER_N_JOBS $MAKE_ARGS
      - make $MAKE_ARGS localization
      - make $MAKE_ARGS install
      - sed -i 's#data/font/#/app/share/cataclysm-dda/font/#g' /app/share/cataclysm-dda/fontdata.json
    sources:
      - type: archive
        url: https://github.com/CleverRaven/Cataclysm-DDA/archive/refs/tags/cdda-experimental-2026-06-14-1053.tar.gz
        sha256: 26b5343743e19d85dbb05bbfc9f85d1130426c00a38e6ad6cc833b6bac7a53f7
