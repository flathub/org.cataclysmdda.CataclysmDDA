id: org.cataclysmdda.CataclysmDDA
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: cataclysm-tiles
finish-args:
  - --socket=pulseaudio
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri

modules:
  - name: cataclysm-tiles
    buildsystem: simple
    build-options:
      cxxflags: -Wno-error=template-body
      prepend-pkg-config-path: /app/lib64/pkgconfig
      prepend-ld-library-path: /app/lib64
      env:
        MAKE_ARGS: PREFIX=/app LANGUAGES=all USE_XDG_DIR=1 TILES=1 SOUND=1 RELEASE=1
          RUNTESTS=0 ASTYLE=0 LINTJSON=0
    build-commands:
      - make -j $FLATPAK_BUILDER_N_JOBS $MAKE_ARGS
      - make $MAKE_ARGS localization
      - make $MAKE_ARGS install
      - sed -i 's#data/font/#/app/share/cataclysm-dda/font/#g' /app/share/cataclysm-dda/fontdata.json
    sources:
      - type: archive
        url: https://github.com/CleverRaven/Cataclysm-DDA/archive/refs/tags/cdda-experimental-2026-09-22-0745.tar.gz
        sha256: 4075a45da35d5611d36bfd23e08a8993834bf93b99e8a729d00d16ef9c3791fa
